<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>15 Funciones - Formularios</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="contenedor">
        <h1>15 Funciones con Formularios</h1>

        <!-- Sección de datos de entrada -->
        <div class="seccion">
            <h2>Datos de entrada</h2>
            <div class="campo">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" placeholder="Escribe tu nombre">
            </div>
            <div class="campo">
                <label for="num1">Número 1:</label>
                <input type="number" id="num1" value="0">
            </div>
            <div class="campo">
                <label for="num2">Número 2:</label>
                <input type="number" id="num2" value="0">
            </div>
        </div>

        <!-- Sección de botones -->
        <div class="seccion">
            <h2>Funciones</h2>
            <div class="botones">
                <button onclick="saludar()" class="btn">1. Saludar</button>
                <button onclick="sumar()" class="btn btn-verde">2. Sumar</button>
                <button onclick="restar()" class="btn btn-verde">3. Restar</button>
                <button onclick="multiplicar()" class="btn btn-verde">4. Multiplicar</button>
                <button onclick="dividir()" class="btn btn-verde">5. Dividir</button>
                <button onclick="mostrarFecha()" class="btn btn-azul">6. Fecha</button>
                <button onclick="mostrarHora()" class="btn btn-azul">7. Hora</button>
                <button onclick="cambiarColor()" class="btn btn-azul">8. Color Azul</button>
                <button onclick="quitarColor()" class="btn btn-gris">9. Quitar Color</button>
                <button onclick="mayusculas()" class="btn btn-morado">10. Mayúsculas</button>
                <button onclick="minusculas()" class="btn btn-morado">11. Minúsculas</button>
                <button onclick="longitud()" class="btn btn-morado">12. Longitud</button>
                <button onclick="doble()" class="btn btn-naranja">13. Doble</button>
                <button onclick="limpiar()" class="btn btn-rojo">14. Limpiar</button>
                <button onclick="mostrarTodo()" class="btn btn-azul">15. Mostrar Todo</button>
            </div>
        </div>

        <!-- Sección de resultado -->
        <div class="seccion">
            <h2>Resultado</h2>
            <div id="resultado" class="resultado">
                Aquí aparecerán los resultados...
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
